name: Deploy 旅章 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the publication allowlist
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$blocked" ]]; then
            printf '%s\n' 'Files outside the publication allowlist are tracked:' "$blocked"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Configure existing Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false
      - name: Install dependencies
        run: npm ci
      - name: Typecheck production source
        run: npm run typecheck
      - name: Build for the repository path
        run: npm run build
        env:
          DEPLOY_BASE: /RPGTravel/
          APP_BUILD: ${{ github.sha }}
      - name: Check production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          unexpected="$(find dist -type f | grep -Ev '\.(html|js|css|png|jpe?g|webmanifest)
          if [[ -n "$unexpected" ]]; then
            printf '%s\n' 'Unexpected production files:' "$unexpected"
            exit 1
          fi
      - name: Upload production files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
 || true)"
